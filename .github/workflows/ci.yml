name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the sticky test report comment
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=reports/tests.json
      - run: npm run build
      - name: Post the test report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/tests.json') != ''
        continue-on-error: true # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r --arg sha "${HEAD_SHA:0:7}" --arg run "$RUN_URL" '
            "<!-- test-report -->",
            "## Test report " + (if .success then "✅" else "❌" end),
            "",
            "| Passed | Failed | Skipped | Total |",
            "|---:|---:|---:|---:|",
            "| \(.numPassedTests) | \(.numFailedTests) | \(.numPendingTests + .numTodoTests) | \(.numTotalTests) |",
            "",
            ([.testResults[].assertionResults[] | select(.status == "failed") | "- `" + .fullName + "`"]
              | if length > 0 then "### Failed\n" + join("\n") + "\n" else empty end),
            "Commit `\($sha)` · [run](\($run))"
          ' reports/tests.json > report.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- test-report -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md
          fi

  privacy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: No statements outside test/fixtures/
        run: git ls-files -z | node scripts/check-data-files.ts
